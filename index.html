<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MindScape — VR Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Firebase (global compat SDK — loaded before module script) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <!-- Three.js import map — Quest 2 Chromium supports this -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.162.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
        }
    }
    </script>

    <style>
        /* ================================================================
           MINDSCAPE VR VIEWER — STYLES
           ================================================================ */
        :root {
            --bg: #08090d;
            --surface: #101218;
            --surface2: #181b24;
            --brand: #7b6cf6;
            --brand-glow: rgba(123,108,246,0.35);
            --accent: #00dfa2;
            --accent-glow: rgba(0,223,162,0.25);
            --danger: #ff5272;
            --text: #e6eaf4;
            --text2: #6e7590;
            --text3: #363b4e;
            --border: rgba(255,255,255,0.06);
            --font: 'Instrument Sans', system-ui, sans-serif;
            --mono: 'DM Mono', 'Courier New', monospace;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Entry Screen ── */
        #entry-screen {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            z-index: 500;
            background: var(--bg);
            transition: opacity 0.5s ease;
        }
        #entry-screen.fade-out { opacity: 0; pointer-events: none; }

        .entry-bg {
            position: fixed; inset: 0; overflow: hidden; pointer-events: none;
        }
        .entry-bg .orb {
            position: absolute; border-radius: 50%; filter: blur(120px);
        }
        .orb-a {
            width: 550px; height: 550px;
            background: radial-gradient(circle, rgba(123,108,246,0.4) 0%, transparent 70%);
            top: -12%; left: -8%;
            animation: dA 18s ease-in-out infinite alternate;
        }
        .orb-b {
            width: 420px; height: 420px;
            background: radial-gradient(circle, rgba(0,223,162,0.22) 0%, transparent 70%);
            bottom: -8%; right: -6%;
            animation: dB 22s ease-in-out infinite alternate;
        }
        .orb-c {
            width: 260px; height: 260px;
            background: radial-gradient(circle, rgba(123,108,246,0.22) 0%, transparent 70%);
            top: 55%; left: 60%;
            animation: dC 14s ease-in-out infinite alternate;
        }
        @keyframes dA { to { transform: translate(70px,50px); } }
        @keyframes dB { to { transform: translate(-50px,-60px); } }
        @keyframes dC { to { transform: translate(-35px,25px) scale(1.15); } }
        .entry-bg::after {
            content: ''; position: absolute; inset: 0;
            background-image: radial-gradient(circle, rgba(255,255,255,0.035) 1px, transparent 1px);
            background-size: 36px 36px;
        }

        .entry-card {
            position: relative; z-index: 1;
            width: 100%; max-width: 460px;
            padding: 44px 36px; margin: 20px;
            background: rgba(16,18,24,0.88);
            border: 1px solid var(--border);
            border-radius: 22px;
            backdrop-filter: blur(40px);
            box-shadow: 0 32px 80px rgba(0,0,0,0.55),
                        inset 0 1px 0 rgba(255,255,255,0.04);
        }

        .brand-row {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 32px;
        }
        .brand-icon {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--brand), #9d8fff);
            border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            font-size: 19px; flex-shrink: 0;
            box-shadow: 0 4px 18px var(--brand-glow);
        }
        .brand-text {
            font-size: 20px; font-weight: 700;
            letter-spacing: -0.03em;
        }
        .brand-text em {
            color: var(--brand); font-style: normal;
        }
        .brand-sub {
            font-size: 10px; color: var(--text3);
            text-transform: uppercase; letter-spacing: 0.14em;
            font-weight: 600; margin-top: 1px;
        }

        .entry-card h2 {
            font-size: 24px; font-weight: 700;
            letter-spacing: -0.03em; margin-bottom: 6px;
        }
        .entry-card .desc {
            color: var(--text2); font-size: 13px;
            line-height: 1.65; margin-bottom: 28px;
        }

        .field { margin-bottom: 18px; }
        .field label {
            display: block; font-size: 10px; font-weight: 700;
            color: var(--text3); text-transform: uppercase;
            letter-spacing: 0.12em; margin-bottom: 7px;
        }
        .field input {
            width: 100%; padding: 13px 15px;
            background: rgba(255,255,255,0.035);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: var(--text); font-family: var(--mono);
            font-size: 14px; outline: none;
            transition: all 0.2s;
        }
        .field input::placeholder { color: var(--text3); }
        .field input:focus {
            border-color: var(--brand);
            background: rgba(123,108,246,0.06);
            box-shadow: 0 0 0 3px rgba(123,108,246,0.12);
        }
        .field-row {
            display: flex; gap: 12px;
        }
        .field-row .field { flex: 1; }

        .btn-go {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, var(--brand), #9d8fff);
            border: none; border-radius: 10px;
            color: white; font-family: var(--font);
            font-size: 14px; font-weight: 700;
            cursor: pointer; transition: all 0.25s;
            box-shadow: 0 4px 18px var(--brand-glow);
            margin-top: 4px;
        }
        .btn-go:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px var(--brand-glow);
        }
        .btn-go:active:not(:disabled) { transform: translateY(0); }
        .btn-go:disabled { opacity: 0.45; cursor: wait; }

        #status-msg {
            margin-top: 14px; font-size: 12px;
            text-align: center; min-height: 18px;
        }
        .s-err  { color: var(--danger); }
        .s-load { color: var(--brand); }
        .s-ok   { color: var(--accent); }

        .quest-tip {
            display: flex; align-items: center; gap: 8px;
            margin-top: 24px; padding: 10px 14px;
            background: rgba(0,223,162,0.06);
            border: 1px solid rgba(0,223,162,0.12);
            border-radius: 9px; font-size: 11px; color: var(--accent);
            line-height: 1.5;
        }

        /* ── Loading Overlay ── */
        #loading-overlay {
            position: fixed; inset: 0;
            background: rgba(8,9,13,0.96);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 400; gap: 20px;
        }
        #loading-overlay.active { display: flex; }
        .load-spinner {
            width: 36px; height: 36px;
            border: 2.5px solid rgba(255,255,255,0.06);
            border-top-color: var(--brand);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .load-text {
            font-size: 14px; font-weight: 500;
            color: var(--text2); text-align: center;
        }
        .load-detail {
            font-size: 11px; color: var(--text3);
            font-family: var(--mono);
        }
        .load-bar-track {
            width: 240px; height: 3px;
            background: rgba(255,255,255,0.06);
            border-radius: 4px; overflow: hidden;
        }
        .load-bar-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--brand), var(--accent));
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        /* ── VR Container ── */
        #vr-container {
            position: fixed; inset: 0;
            display: none; z-index: 100;
        }
        #vr-container.active { display: block; }
        #vr-container canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            position: relative;
            z-index: 1;
        }

        /* ── HUD (non-VR overlay) ── */
        #hud {
            position: fixed;
            bottom: 20px; left: 50%;
            transform: translateX(-50%);
            z-index: 300;
            background: rgba(8,9,13,0.82);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 10px 18px;
            display: none;
            align-items: center; gap: 14px;
            box-shadow: 0 8px 36px rgba(0,0,0,0.55);
        }
        #hud.active { display: flex; }
        .hud-name {
            font-size: 13px; font-weight: 600;
            max-width: 180px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .hud-div { width: 1px; height: 22px; background: var(--border); }
        .hud-btn {
            padding: 7px 12px;
            border: 1px solid var(--border);
            border-radius: 7px;
            background: rgba(255,255,255,0.04);
            color: var(--text); font-family: var(--font);
            font-size: 11px; font-weight: 600;
            cursor: pointer; transition: all 0.15s;
            white-space: nowrap;
        }
        .hud-btn:hover { background: rgba(255,255,255,0.08); }
        .hud-btn.vr-btn { background: var(--brand); border-color: var(--brand); }
        .hud-btn.vr-btn:hover { filter: brightness(1.15); }
        .hud-btn.exit-btn { color: var(--danger); border-color: rgba(255,82,114,0.25); }

        /* ── WebXR VR Button Override ── */
        #VRButton {
            background: linear-gradient(135deg, var(--brand), #9d8fff) !important;
            font-family: var(--font) !important;
            font-weight: 600 !important;
            border-radius: 10px !important;
            box-shadow: 0 4px 18px var(--brand-glow) !important;
        }

        /* ── Responsive ── */
        @media (max-width: 520px) {
            .entry-card { padding: 32px 24px; }
            .entry-card h2 { font-size: 20px; }
            .field-row { flex-direction: column; gap: 0; }
        }
    </style>
</head>
<body>

<!-- ════════════════════════════════════════════
     ENTRY SCREEN
     ════════════════════════════════════════════ -->
<div id="entry-screen">
    <div class="entry-bg">
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="orb orb-c"></div>
    </div>
    <div class="entry-card">
        <div class="brand-row">
            <div class="brand-icon">🧠</div>
            <div>
                <div class="brand-text">Mind<em>Scape</em></div>
                <div class="brand-sub">VR Experience Viewer</div>
            </div>
        </div>

        <h2>Enter Your Experience</h2>
        <p class="desc">
            Paste the Private ID you received from your therapist to load
            your personalised VR environment.
        </p>

        <div class="field">
            <label>Private ID</label>
            <input type="text" id="inp-id" placeholder="CRE-1718234567890-A1B2C3D4E"
                   autocomplete="off" spellcheck="false">
        </div>

        <div class="field">
            <label>Your Display Name (for multiplayer)</label>
            <input type="text" id="inp-name" placeholder="e.g. Alex"
                   autocomplete="off" maxlength="24">
        </div>

        <button class="btn-go" id="btn-go">Launch Experience</button>
        <div id="status-msg"></div>

        <div class="quest-tip">
            🥽&nbsp; Open this page in your <strong>Meta Quest Browser</strong> and
            tap <strong>Enter VR</strong> once the scene loads.
        </div>
    </div>
</div>

<!-- ════════════════════════════════════════════
     LOADING OVERLAY
     ════════════════════════════════════════════ -->
<div id="loading-overlay">
    <div class="load-spinner"></div>
    <div class="load-text" id="load-text">Fetching experience…</div>
    <div class="load-detail" id="load-detail"></div>
    <div class="load-bar-track">
        <div class="load-bar-fill" id="load-bar"></div>
    </div>
</div>

<!-- ════════════════════════════════════════════
     VR SCENE CONTAINER
     ════════════════════════════════════════════ -->
<div id="vr-container"></div>

<!-- ════════════════════════════════════════════
     HUD (shown in non-VR mode)
     ════════════════════════════════════════════ -->
<div id="hud">
    <div class="hud-name" id="hud-name">—</div>
    <div class="hud-div"></div>
    <button class="hud-btn" id="hud-music" title="Toggle music">🔊 Music</button>
    <button class="hud-btn exit-btn" id="hud-exit">✕ Exit</button>
</div>


<!-- ════════════════════════════════════════════════════════════════════
     MAIN APPLICATION — ES MODULE
     ════════════════════════════════════════════════════════════════════ -->
<script type="module">
import * as THREE from 'three';
import { RGBELoader }  from 'three/addons/loaders/RGBELoader.js';
import { VRButton }     from 'three/addons/webxr/VRButton.js';

/* ──────────────────────────────────────────────
   1.  FIREBASE INIT
   ────────────────────────────────────────────── */
const firebaseConfig = {
    apiKey:            "AIzaSyDVjRXdxM6qS-T-68FJpAQRpZYCHDPFWLo",
    authDomain:        "vrweb-ac6b4.firebaseapp.com",
    projectId:         "vrweb-ac6b4",
    storageBucket:     "vrweb-ac6b4.firebasestorage.app",
    messagingSenderId: "1019413496033",
    appId:             "1:1019413496033:web:70f91e48c8f15a9b1cb7a0",
    databaseURL:       "https://vrweb-ac6b4-default-rtdb.firebaseio.com"   // ← needed for Realtime DB multiplayer
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
// const rtdb = firebase.database();   // ← uncomment when multiplayer is wired up


/* ──────────────────────────────────────────────
   2.  DOM REFS
   ────────────────────────────────────────────── */
const entryScreen    = document.getElementById('entry-screen');
const loadingOverlay = document.getElementById('loading-overlay');
const loadText       = document.getElementById('load-text');
const loadDetail     = document.getElementById('load-detail');
const loadBar        = document.getElementById('load-bar');
const vrContainer    = document.getElementById('vr-container');
const hud            = document.getElementById('hud');
const hudName        = document.getElementById('hud-name');
const hudMusic       = document.getElementById('hud-music');
const hudExit        = document.getElementById('hud-exit');
const btnGo          = document.getElementById('btn-go');
const inpId          = document.getElementById('inp-id');
const inpName        = document.getElementById('inp-name');
const statusMsg      = document.getElementById('status-msg');


/* ──────────────────────────────────────────────
   3.  APP STATE
   ────────────────────────────────────────────── */
let creationData   = null;   // Firestore doc
let scene, camera, renderer, clock;
let listener, bgMusic;       // audio
let hotspotMesh    = null;
let hotspotPanel   = null;   // floating image panel near hotspot
let promptPanel    = null;   // prompt image panel
let xrSession      = null;
let controllers    = [];
let cameraRig;               // group that moves with locomotion
let raycaster      = new THREE.Raycaster();
let tempMatrix     = new THREE.Matrix4();
let interactables  = [];     // meshes the ray can hit
let musicPlaying   = false;
const playerName   = () => inpName.value.trim() || 'Guest';


/* ──────────────────────────────────────────────
   4.  STATUS HELPERS
   ────────────────────────────────────────────── */
function setStatus(msg, cls = '') {
    statusMsg.textContent = msg;
    statusMsg.className   = cls;
}
function showLoading(text, detail = '') {
    loadText.textContent   = text;
    loadDetail.textContent = detail;
    loadBar.style.width    = '0%';
    loadingOverlay.classList.add('active');
}
function setProgress(pct, detail = '') {
    loadBar.style.width    = pct + '%';
    if (detail) loadDetail.textContent = detail;
}
function hideLoading() { loadingOverlay.classList.remove('active'); }


/* ──────────────────────────────────────────────
   5.  FETCH CREATION FROM FIRESTORE
   ────────────────────────────────────────────── */
async function fetchCreation(creationId) {
    const doc = await db.collection('creations').doc(creationId).get();
    if (!doc.exists) throw new Error('No experience found with that ID.');
    return doc.data();
}


/* ──────────────────────────────────────────────
   6.  THREE.JS SCENE SETUP
   ────────────────────────────────────────────── */
function initScene() {
    // Clock
    clock = new THREE.Clock();

    // Scene
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    // Camera rig (for locomotion — move the rig, camera stays at origin of rig)
    cameraRig = new THREE.Group();
    scene.add(cameraRig);

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 0);   // eye height
    cameraRig.add(camera);

    // Audio listener
    listener = new THREE.AudioListener();
    camera.add(listener);

    // Renderer
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));   // Quest 2 perf cap
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding   = THREE.sRGBEncoding;
    renderer.toneMapping      = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.xr.enabled       = true;
    vrContainer.appendChild(renderer.domElement);

    // VR button
    const vrBtn = VRButton.createButton(renderer);
    vrBtn.id = 'VRButton';
    document.body.appendChild(vrBtn);

    // XR session events
    renderer.xr.addEventListener('sessionstart', () => {
        xrSession = renderer.xr.getSession();
        hud.classList.remove('active');
    });
    renderer.xr.addEventListener('sessionend', () => {
        xrSession = null;
        hud.classList.add('active');
    });

    // Ambient light (for prompt/hotspot panels)
    const ambient = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambient);

    // Ground reference ring (subtle)
    const ringGeo = new THREE.RingGeometry(1.8, 2, 64);
    const ringMat = new THREE.MeshBasicMaterial({
        color: 0x7b6cf6, transparent: true, opacity: 0.15, side: THREE.DoubleSide
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.y = 0.01;
    scene.add(ring);

    // Controllers
    setupControllers();

    // Resize
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}


/* ──────────────────────────────────────────────
   7.  XR CONTROLLERS + RAY
   ────────────────────────────────────────────── */
function setupControllers() {
    for (let i = 0; i < 2; i++) {
        const controller = renderer.xr.getController(i);
        cameraRig.add(controller);

        // Ray line
        const lineGeo = new THREE.BufferGeometry().setFromPoints([
            new THREE.Vector3(0, 0, 0),
            new THREE.Vector3(0, 0, -4)
        ]);
        const lineMat = new THREE.LineBasicMaterial({
            color: 0x7b6cf6, transparent: true, opacity: 0.5
        });
        const line = new THREE.Line(lineGeo, lineMat);
        line.visible = false;
        controller.add(line);
        controller.userData.ray = line;

        // Events
        controller.addEventListener('selectstart', onSelectStart);
        controller.addEventListener('connected', (e) => {
            controller.userData.gamepad = e.data.gamepad;
            controller.userData.handedness = e.data.handedness;
            line.visible = true;
        });
        controller.addEventListener('disconnected', () => {
            line.visible = false;
        });

        controllers.push(controller);
    }
}

function onSelectStart(event) {
    const controller = event.target;
    tempMatrix.identity().extractRotation(controller.matrixWorld);
    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

    const hits = raycaster.intersectObjects(interactables, false);
    if (hits.length > 0) {
        const obj = hits[0].object;
        if (obj === hotspotMesh && hotspotPanel) {
            hotspotPanel.visible = !hotspotPanel.visible;
        }
    }
}


/* ──────────────────────────────────────────────
   8.  THUMBSTICK LOCOMOTION
   ────────────────────────────────────────────── */
function handleLocomotion(dt) {
    if (!xrSession) return;
    const speed = 2.0;   // m/s

    for (const ctrl of controllers) {
        const gp = ctrl.userData.gamepad;
        if (!gp || !gp.axes) continue;

        // Typically axes[2] = thumbstick X, axes[3] = thumbstick Y
        const axisX = gp.axes[2] || 0;
        const axisY = gp.axes[3] || 0;

        if (Math.abs(axisX) > 0.15 || Math.abs(axisY) > 0.15) {
            // Movement relative to camera direction
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            dir.y = 0;
            dir.normalize();

            const right = new THREE.Vector3();
            right.crossVectors(dir, new THREE.Vector3(0, 1, 0)).normalize();

            cameraRig.position.addScaledVector(dir,   -axisY * speed * dt);
            cameraRig.position.addScaledVector(right,   axisX * speed * dt);
        }

        // Snap-turn on the other controller's thumbstick (if right hand)
        if (ctrl.userData.handedness === 'right') {
            const turnAxis = gp.axes[2] || 0;
            if (Math.abs(turnAxis) > 0.6 && !ctrl.userData.turnLock) {
                cameraRig.rotation.y -= Math.sign(turnAxis) * (Math.PI / 6);
                ctrl.userData.turnLock = true;
            }
            if (Math.abs(turnAxis) < 0.3) ctrl.userData.turnLock = false;
        }
    }
}


/* ──────────────────────────────────────────────
   9.  GAZE RAYCASTING (non-VR fallback)
   ────────────────────────────────────────────── */
function handleGaze() {
    if (xrSession) return;   // use controller ray in VR
    raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
    const hits = raycaster.intersectObjects(interactables, false);

    if (hotspotMesh) {
        const gazing = hits.length > 0 && hits[0].object === hotspotMesh;
        hotspotMesh.material.opacity = gazing ? 1.0 : 0.65;
        if (hotspotPanel) hotspotPanel.visible = gazing;
    }
}


/* ──────────────────────────────────────────────
   10. ASSET LOADERS
   ────────────────────────────────────────────── */

// 10a — HDR Skybox
function loadHDR(url) {
    return new Promise((resolve, reject) => {
        const loader = new RGBELoader();
        loader.load(url,
            (texture) => {
                texture.mapping = THREE.EquirectangularReflectionMapping;
                scene.background    = texture;
                scene.environment   = texture;
                resolve();
            },
            (progress) => {
                if (progress.total) {
                    const pct = Math.round((progress.loaded / progress.total) * 100);
                    setProgress(pct, `HDR skybox — ${pct}%`);
                }
            },
            reject
        );
    });
}

// 10b — Image Skybox
function loadImageSkybox(url) {
    return new Promise((resolve, reject) => {
        const loader = new THREE.TextureLoader();
        loader.load(url,
            (texture) => {
                texture.mapping  = THREE.EquirectangularReflectionMapping;
                texture.encoding = THREE.sRGBEncoding;
                scene.background = texture;
                resolve();
            },
            undefined,
            reject
        );
    });
}

// 10c — Load background (auto-detect HDR vs image)
async function loadBackground(url) {
    if (!url) return;
    const lower = url.toLowerCase();
    if (lower.endsWith('.hdr')) {
        await loadHDR(url);
    } else {
        await loadImageSkybox(url);
    }
}

// 10d — Music (HTML5 Audio — reliable on Quest 2)
function loadMusic(url) {
    if (!url) return;
    bgMusic = new Audio();
    bgMusic.crossOrigin = 'anonymous';
    bgMusic.loop = true;
    bgMusic.volume = 0.5;
    bgMusic.preload = 'auto';
    bgMusic.src = url;

    bgMusic.addEventListener('canplaythrough', () => {
        console.log('[Music] Ready to play');
        hudMusic.style.display = 'inline-flex';
        hudMusic.textContent = '▶ Play Music';
    });
    bgMusic.addEventListener('error', (e) => {
        console.warn('[Music] Load failed:', e);
        hudMusic.textContent = '⚠ No Audio';
        hudMusic.disabled = true;
    });
    bgMusic.load();
}

// 10e — Create a floating image panel
function createImagePanel(url, position, width = 1.2) {
    return new Promise((resolve) => {
        const loader = new THREE.TextureLoader();
        loader.load(url, (tex) => {
            tex.encoding = THREE.sRGBEncoding;
            const aspect = tex.image.width / tex.image.height;
            const h = width / aspect;

            const geo = new THREE.PlaneGeometry(width, h);
            const mat = new THREE.MeshBasicMaterial({
                map: tex, side: THREE.DoubleSide, transparent: true
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.copy(position);

            // Always face camera (updated in render loop)
            mesh.userData.billboard = true;

            scene.add(mesh);
            resolve(mesh);
        }, undefined, () => resolve(null));
    });
}

// 10f — Hotspot marker
function createHotspot(x, y, z, imageUrl, label) {
    // Glowing sphere
    const geo = new THREE.SphereGeometry(0.12, 32, 32);
    const mat = new THREE.MeshBasicMaterial({
        color: 0x7b6cf6, transparent: true, opacity: 0.65
    });
    hotspotMesh = new THREE.Mesh(geo, mat);
    hotspotMesh.position.set(x, y, z);
    scene.add(hotspotMesh);
    interactables.push(hotspotMesh);

    // Outer glow ring
    const ringGeo = new THREE.RingGeometry(0.18, 0.22, 32);
    const ringMat = new THREE.MeshBasicMaterial({
        color: 0x7b6cf6, transparent: true, opacity: 0.3, side: THREE.DoubleSide
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.copy(hotspotMesh.position);
    ring.userData.billboard = true;
    scene.add(ring);
    hotspotMesh.userData.ring = ring;

    // Label sprite
    if (label) {
        const canvas  = document.createElement('canvas');
        canvas.width  = 512; canvas.height = 64;
        const ctx     = canvas.getContext('2d');
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        ctx.roundRect(0, 0, 512, 64, 12);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.font      = '28px Instrument Sans, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, 256, 32);

        const tex    = new THREE.CanvasTexture(canvas);
        const spMat  = new THREE.SpriteMaterial({ map: tex, transparent: true });
        const sprite = new THREE.Sprite(spMat);
        sprite.scale.set(1.2, 0.15, 1);
        sprite.position.set(x, y + 0.3, z);
        scene.add(sprite);
    }

    // Floating image panel (hidden by default, shows on gaze/click)
    if (imageUrl) {
        const panelPos = new THREE.Vector3(x, y + 0.6, z);
        createImagePanel(imageUrl, panelPos, 1.0).then(panel => {
            if (panel) {
                panel.visible = false;
                hotspotPanel  = panel;
            }
        });
    }
}


/* ──────────────────────────────────────────────
   11. BUILD SCENE FROM CREATION DATA
   ────────────────────────────────────────────── */
async function buildScene(data) {
    showLoading('Building your VR environment…');

    const sceneData = data.data?.scene || {};
    const assets    = data.assets || {};

    // Background — prefer assets.backgroundUrl, fall back to scene data
    const bgUrl = assets.backgroundUrl || sceneData.backgroundUrl;
    if (bgUrl) {
        setProgress(10, 'Loading skybox…');
        try   { await loadBackground(bgUrl); }
        catch { console.warn('Background load failed, using fallback colour'); }
    }
    setProgress(50, 'Skybox ready');

    // Music
    const musicUrl = assets.musicUrl || sceneData.musicUrl;
    console.log('[Build] Music URL:', musicUrl);
    console.log('[Build] assets:', JSON.stringify(assets));
    console.log('[Build] sceneData keys:', Object.keys(sceneData));
    if (musicUrl) {
        setProgress(60, 'Loading music…');
        loadMusic(musicUrl);
    } else {
        hudMusic.textContent = '🚫 No Music';
        hudMusic.disabled = true;
        hudMusic.style.opacity = '0.4';
    }
    setProgress(70, 'Music loaded');

    // Prompt image — show as floating panel in front of user
    const promptUrl = assets.promptImageUrl || sceneData.promptImageUrl;
    if (promptUrl) {
        setProgress(80, 'Loading prompt image…');
        promptPanel = await createImagePanel(
            promptUrl,
            new THREE.Vector3(0, 1.6, -2.5),
            1.4
        );
    }

    // Hotspot
    const hs = data.hotspot || {};
    if (hs.x !== undefined && hs.y !== undefined && hs.z !== undefined) {
        setProgress(90, 'Placing hotspot…');
        createHotspot(
            hs.x, hs.y, hs.z,
            hs.imageUrl || null,
            hs.imageLabel || data.assets?.promptImageLabel || null
        );
    } else if (sceneData.hotspotX !== undefined) {
        setProgress(90, 'Placing hotspot…');
        createHotspot(
            sceneData.hotspotX, sceneData.hotspotY, sceneData.hotspotZ,
            sceneData.hotspotImageUrl || null,
            sceneData.hotspotImageLabel || null
        );
    }

    setProgress(100, 'Ready!');
    await new Promise(r => setTimeout(r, 400));
    hideLoading();
}


/* ──────────────────────────────────────────────
   12. RENDER LOOP
   ────────────────────────────────────────────── */
function animate() {
    renderer.setAnimationLoop((time, frame) => {
        const dt = clock.getDelta();

        // Thumbstick locomotion
        handleLocomotion(dt);

        // Gaze interaction (non-VR)
        handleGaze();

        // Animate hotspot
        if (hotspotMesh) {
            hotspotMesh.scale.setScalar(1 + 0.08 * Math.sin(time / 400));
            const ring = hotspotMesh.userData.ring;
            if (ring) {
                ring.scale.setScalar(1 + 0.12 * Math.sin(time / 500));
            }
        }

        // Billboards face camera
        scene.traverse(obj => {
            if (obj.userData.billboard) {
                obj.lookAt(camera.getWorldPosition(new THREE.Vector3()));
            }
        });

        renderer.render(scene, camera);
    });
}


/* ──────────────────────────────────────────────
   13. MUSIC CONTROLS
   ────────────────────────────────────────────── */
hudMusic.addEventListener('click', () => {
    if (!bgMusic) return;
    if (musicPlaying) {
        bgMusic.pause();
        hudMusic.textContent = '▶ Play Music';
    } else {
        bgMusic.play().catch(e => console.warn('Audio play blocked:', e));
        hudMusic.textContent = '⏸ Pause Music';
    }
    musicPlaying = !musicPlaying;
});


/* ──────────────────────────────────────────────
   14. EXIT → BACK TO ENTRY
   ────────────────────────────────────────────── */
hudExit.addEventListener('click', () => {
    if (bgMusic) { bgMusic.pause(); bgMusic.src = ''; }
    musicPlaying = false;
    renderer.setAnimationLoop(null);
    renderer.dispose();
    vrContainer.classList.remove('active');
    hud.classList.remove('active');
    entryScreen.style.display = 'flex';
    entryScreen.classList.remove('fade-out');

    // Remove VR button
    const vrBtn = document.getElementById('VRButton');
    if (vrBtn) vrBtn.remove();

    // Clear scene
    while (scene.children.length) scene.remove(scene.children[0]);
    hotspotMesh = hotspotPanel = promptPanel = null;
    interactables = [];
    vrContainer.innerHTML = '';
});


/* ──────────────────────────────────────────────
   15. MULTIPLAYER — ARCHITECTURE STUBS
       (Firebase Realtime DB — ready to activate)
   ────────────────────────────────────────────── */

    │  REALTIME DB STRUCTURE (future)                  │
    │                                                  │
    │  rooms/                                          │
    │    {creationId}/                                 │
    │      users/                                      │
    │        {visitorId}/                               │
    │          name:     "Alex"                        │
    │          color:    "#7b6cf6"                     │
    │          position: { x: 0, y: 1.6, z: 0 }      │
    │          rotation: { x: 0, y: 0, z: 0, w: 1 }  │
    │          lastSeen: 1718234567890                 │
    │                                                  │
    │  Max 5 users per room.                           │
    └─────────────────────────────────────────────────┘  */

const VISITOR_ID   = 'v-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
const AVATAR_COLORS = ['#7b6cf6', '#00dfa2', '#ff5272', '#f5a623', '#3bc9db'];
const peerAvatars   = {};   // { visitorId: THREE.Group }

// Generates a simple avatar: sphere head + name label
function createAvatar(name, color) {
    const group = new THREE.Group();

    // Head
    const headGeo = new THREE.SphereGeometry(0.15, 24, 24);
    const headMat = new THREE.MeshStandardMaterial({ color, roughness: 0.3 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.y = 1.6;
    group.add(head);

    // Name label
    const canvas  = document.createElement('canvas');
    canvas.width  = 256; canvas.height = 48;
    const ctx     = canvas.getContext('2d');
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.roundRect(0, 0, 256, 48, 8);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font      = '22px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(name.slice(0, 16), 128, 24);

    const tex    = new THREE.CanvasTexture(canvas);
    const spMat  = new THREE.SpriteMaterial({ map: tex, transparent: true });
    const sprite = new THREE.Sprite(spMat);
    sprite.scale.set(0.8, 0.15, 1);
    sprite.position.y = 1.9;
    group.add(sprite);

    return group;
}

/* ──────────────────────────────────────────────
   16. MAIN ENTRY FLOW
   ────────────────────────────────────────────── */
btnGo.addEventListener('click', async () => {
    const id = inpId.value.trim();
    if (!id) { setStatus('Please enter a Private ID.', 's-err'); return; }

    btnGo.disabled = true;
    setStatus('Connecting to MindScape…', 's-load');

    try {
        // 1. Fetch creation
        creationData = await fetchCreation(id);
        setStatus('Experience found! Loading assets…', 's-ok');

        // 2. Init Three.js + WebXR
        initScene();

        // 3. Fade out entry screen
        entryScreen.classList.add('fade-out');
        await new Promise(r => setTimeout(r, 500));
        entryScreen.style.display = 'none';

        // 4. Show VR container + HUD
        vrContainer.classList.add('active');
        hud.classList.add('active');
        hudName.textContent = creationData.name || 'Untitled Experience';

        // 5. Build scene from data
        await buildScene(creationData);

        // 6. Start render loop
        animate();

        // 7. Multiplayer — uncomment when ready
        // joinRoom(id);

    } catch (err) {
        console.error(err);
        setStatus(err.message || 'Failed to load experience.', 's-err');
        btnGo.disabled = false;
    }
});

// Allow Enter key
inpId.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') btnGo.click();
});
